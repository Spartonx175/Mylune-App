# Source allowlist (SPEC section 7). Every health statement in /content cites an id from `sources`.
# Anything outside allowed_domains needs Div's approval first. Subdomains match (e.g. www.ameli.fr).
# Entries are added by the content sessions (C1+), each read and dated when the content is written.
allowed_domains:
  # France (primary)
  - ameli.fr
  - santepubliquefrance.fr
  - 1000jours.fr
  - has-sante.fr
  - cngof.fr
  - mangerbouger.fr
  - service-public.fr
  - caf.fr
  # International
  - nhs.uk
  - acog.org
  - who.int
  - cdc.gov
  - nice.org.uk
  # Medicines in pregnancy (France), approved by Div 2026-11-13 for the medicines checker
  - lecrat.fr
  - ansm.sante.fr
  - medicaments.gouv.fr
  # Peer-reviewed, for specific claims only (cite author/year/journal in the title)
  - pubmed.ncbi.nlm.nih.gov

