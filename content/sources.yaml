  - ameli.fr
  - santepubliquefrance.fr
  - 1000jours.fr
  - has-sante.fr
  - cngof.fr
  - mangerbouger.fr
  - service-public.fr
  - caf.fr
  # International
  - nhs.uk
  - acog.org
  - who.int
  - cdc.gov
  - nice.org.uk
  # Peer-reviewed, for specific claims only (cite author/year/journal in the title)
  - pubmed.ncbi.nlm.nih.gov

