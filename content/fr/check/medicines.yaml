  tips: [avoid]
  local: true
  answers:
    - state: not_applicable
      verdict: avoid
      why: "Les anti-inflammatoires comme l'ibuprofène ne doivent pas être pris de votre propre initiative pendant la grossesse. À partir de 24 semaines d'aménorrhée (SA) (le début du 6e mois), ils sont formellement interdits, même un seul comprimé, car ils peuvent nuire aux reins et au cœur du bébé. Avant cette date, seulement si un médecin juge que c'est vraiment nécessaire. Le paracétamol est préféré. En cas de doute, demandez à votre pharmacien ou à votre médecin."
