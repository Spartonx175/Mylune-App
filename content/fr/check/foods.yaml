  names:
    - Steak de cerf
    - Pavé de biche
    - Biche
    - Venison steak
  local: true
  answers:
    - state: undercooked
      verdict: avoid
      why: "Steak de cerf : le gibier rosé peut porter le parasite de la toxoplasmose. Le gibier fumé, mariné ou grillé n'est sûr que s'il est cuit à cœur."
      sources:
        - ameli-toxo-prevention
        - mangerbouger-aliments-eviter
        - nhs-foods-to-avoid
    - state: cooked
      verdict: careful
      why: "Steak de cerf : cuit à cœur, il évite le risque de toxoplasmose. Le NHS conseille d'éviter pendant la grossesse le gibier comme l'oie, la perdrix, le faisan et le cerf, à cause du plomb de chasse. Demandez à votre sage-femme."
      sources:
        - nhs-foods-to-avoid
        - ameli-toxo-prevention
  reviewed: 2026-11-14
