    - "Ibuprofène"
  active_ingredient: "ibuprofen"
  tips: [avoid]
  local: true
  answers:
    - state: not_applicable
      verdict: avoid
      why: "Anti-inflammatories like ibuprofen should not be taken on your own in pregnancy. From 24 weeks of amenorrhoea (the start of the 6th month) they are formally forbidden, even a single tablet, because they can harm the baby's kidneys and heart. Before that, only if a doctor says it is really needed. Paracetamol is preferred. If you are unsure, ask your pharmacist or doctor."
      sources:
