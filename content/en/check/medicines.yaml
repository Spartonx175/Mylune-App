# "Can I take this?" checker, part 3: medicines. Authored in English first (CheckItem[], lib/content/check-types.ts). FR mirrors ids, verdicts and sources later.
# Verdicts for medicines: ok = usually compatible when used as directed by a pharmacist or doctor; careful = ask a pharmacist or doctor first; avoid = avoid.
# Only marked ok when CRAT/ANSM clearly say compatible. No doses, counts, frequencies or durations. Every why ends with a pointer to the pharmacist or doctor.
# CRAT (lecrat.fr) and ANSM first, then NHS. Stage rules (e.g. anti-inflammatories from 24 weeks of amenorrhoea) are stated in the why.
