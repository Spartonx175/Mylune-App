- id: foie-gras
  category: charcuterie
  names:
    - Foie gras
    - Foie gras de canard
    - Foie gras d'oie
    - Mi-cuit
    - Terrine de foie gras
    - Bloc de foie gras
  tips: *a1
  local: true
  answers:
    - state: cooked
      verdict: avoid
      why: Foie gras (fresh, mi-cuit or in a block) is a chilled cooked product that can carry listeria. It is also liver, rich in vitamin A.
      sources:
        - ameli-aliments-eviter
        - mangerbouger-aliments-eviter
        - nhs-foods-to-avoid
    - state: canned
      verdict: careful
      why: French advice is to skip it altogether. A tin or jar sterilised in its container is safer, but ask your midwife if you want it, and skip it if it is liver-based.
      sources:
        - mangerbouger-aliments-eviter
        - cdc-listeria-meat-fish
        - nhs-foods-to-avoid
  reviewed: 2026-11-13
