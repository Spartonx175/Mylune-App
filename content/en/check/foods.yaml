      verdict: avoid
      why: "Raw-milk cheese is avoided in France, especially soft cheese, because it can carry listeria. The exception is hard cooked-pressed cheese such as comté, beaufort, emmental, gruyère and parmesan: it is heated and aged for a long time, so it is fine even when made with raw milk."
