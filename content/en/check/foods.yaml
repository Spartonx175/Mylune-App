# "Can I eat this?" checker, part 1: meat, charcuterie, fish, seafood, eggs, dairy, cheese, ready meals, egg/fish-based sauces.
# Authored in English first (CheckItem[], lib/content/check-types.ts). FR mirrors the same ids, states, verdicts and sources later.
# Sources are ids in content/sources.yaml. avoid/careful need 2 sources, ok needs 1. No doses, no diagnosis.
# French rules (ameli, mangerbouger) take priority over UK/US where they are stricter (pâté, soft cheese, cured meat).
- id: beef-steak
  category: meat
  names:
    - Beef steak
    - Bœuf
    - Steak
    - Entrecôte
    - Faux-filet
    - Bavette
    - Rumsteck
    - Côte de bœuf
    - Rosbif
  local: true
  answers:
    - state: undercooked
      verdict: avoid
      why: Rare or pink beef (saignant, à point) can carry the toxoplasmosis parasite. If you are not immune to toxoplasmosis, cook it until it is no longer pink inside.
      sources:
        - ameli-toxo-prevention
        - mangerbouger-aliments-eviter
        - nhs-toxoplasmosis
    - state: cooked
      verdict: ok
      why: "Beef cooked right through (bien cuit) is safe. Cut it open: there should be no pink juice."
      sources:
        - ameli-toxo-prevention
        - cdc-toxo-prevention
  reviewed: 2026-11-13
- id: steak-hache
  category: meat
  names:
    - Minced beef
    - Steak haché
    - Viande hachée
    - Boulette
    - Bolognaise
    - Beef mince
  local: true
  answers:
    - state: undercooked
      verdict: avoid
      why: Pink minced meat is risky because germs from the surface are mixed all through it. Toxoplasmosis and other germs survive if the middle is still pink.
      sources:
        - ameli-aliments-eviter
        - ameli-toxo-prevention
        - nhs-foods-to-avoid
    - state: cooked
      verdict: ok
      why: Minced meat cooked right through, grey-brown with no pink and no pink juice, is safe.
      sources:
        - ameli-toxo-prevention
        - nhs-foods-to-avoid
        - cdc-food-pregnant-women
  reviewed: 2026-11-13
